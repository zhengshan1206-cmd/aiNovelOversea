dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/global/tab/
    - assets/global/launch/
    - assets/global/common/
    - assets/global/login/
    - assets/home/
    - assets/home/main/
    - assets/home/novel/
    - assets/home/create/
    - assets/me/
    - assets/me/survey/
    - assets/tutorial/
    - assets/tutorial/checkin/
    - assets/
    - assets/pay/
    - assets/pay/pay_bg.mp4

flutter_launcher_icons:
  image_path: "assets/icon.png"  # 原始图标路径
  android: true  # 生成 Android 图标
  ios: 
    enabled: true
    icon_name: "AppIcon"  # 生成 iOS 图标flutter pub run flutter_launcher_icons:main